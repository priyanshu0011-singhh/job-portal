spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.devtools.restart.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

server.port=${PORT:8099}
app.jwtSecret=${JWT_SECRET}
app.jwtExpirationMs=${JWT_EXPIRATION_MS:3600000}
app.upload.dir=${APP_UPLOAD_DIR}
app.admin.bootstrap-enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:}
app.admin.contact-number=${ADMIN_CONTACT_NUMBER:}