spring.datasource.url=jdbc:h2:mem:jobportal;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.h2.console.enabled=false
spring.flyway.enabled=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

server.port=${PORT:8099}
server.forward-headers-strategy=native

app.jwtSecret=${JWT_SECRET}
app.jwtExpirationMs=${JWT_EXPIRATION_MS:3600000}
app.upload.dir=${APP_UPLOAD_DIR:/tmp/jobportal/resumes}
app.upload.max-size=${APP_UPLOAD_MAX_SIZE:10MB}
spring.servlet.multipart.max-file-size=${APP_UPLOAD_MAX_SIZE:10MB}
spring.servlet.multipart.max-request-size=${APP_UPLOAD_MAX_SIZE:10MB}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
