spring.devtools.restart.enabled=false
spring.devtools.add-properties=false
spring.application.name=JobPortal
spring.datasource.url=${DB_URL:jdbc:h2:mem:jobportal;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.h2.console.enabled=false
spring.thymeleaf.cache=false

server.port=${PORT:${SERVER_PORT:8099}}
server.forward-headers-strategy=native

app.jwtSecret=${JWT_SECRET:dev-local-secret-key-change-me-please-change}
app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

app.upload.dir=${APP_UPLOAD_DIR:uploads/resumes}
app.upload.max-size=${APP_UPLOAD_MAX_SIZE:10MB}
spring.servlet.multipart.max-file-size=${APP_UPLOAD_MAX_SIZE:10MB}
spring.servlet.multipart.max-request-size=${APP_UPLOAD_MAX_SIZE:10MB}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=livenessState,readinessState
